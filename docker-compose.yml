services:
  recorder:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATA_DIR: /app/data
      MAX_UPLOAD_MB: 512
      ORDER_LOOKUP_API_URL: ${ORDER_LOOKUP_API_URL:-https://shopee.techly.id/api/orders/by-tracking-number}
      ORDER_LOOKUP_API_KEY: ${ORDER_LOOKUP_API_KEY:-}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  caddy:
    image: caddy:2
    depends_on:
      - recorder
    ports:
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
    restart: unless-stopped
